name: Rendimiento JMeter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rendimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar JMeter 5.6.3
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH
      - name: Levantar API
        run: |
          nohup python3 api-ticketmania-simple/ticketmania_simple.py > api.log 2>&1 &
      - name: Esperar API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/salud; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Ejecutar JMeter
        working-directory: pruebas/jmeter
        run: |
          jmeter -n -t "HTTP Request.jmx" -l resultados.jtl -e -o reporte
      - name: Revisar resultados
        working-directory: pruebas/jmeter
        run: |
          FALLAS=$(grep -c ',false,' resultados.jtl || true)
          echo "Peticiones fallidas: $FALLAS"
          if [ "$FALLAS" -gt 0 ]; then
            exit 1
          fi
      - name: Subir reporte
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jmeter
          path: pruebas/jmeter/reporte